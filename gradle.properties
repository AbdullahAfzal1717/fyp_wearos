org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Fail fast on unreachable mirrors (avoids long "getsockopt" hangs).
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=15000
# No HTTP proxy needed for typical home/ISP; leave unset unless your network requires one.
